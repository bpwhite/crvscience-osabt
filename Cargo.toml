[package]
name = "osabt"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Bryan P. White <https://crvscience.com>"]
license = "GPL-3.0-or-later"
description = "Open Source Ad-hoc Biology Tools (OSABT) — unified 20-tool GPL-3.0 CLI, TUI, and GUI biology toolkit for the CRV Science Network."
repository = "https://github.com/bpwhite/crvscience-osabt"
homepage = "https://crvscience.com/apps"
keywords = ["biology", "bioinformatics", "ecology", "ecophysiology", "biostatistics"]
categories = ["science", "command-line-utilities", "gui", "wasm"]
readme = "README.md"

[lib]
name = "osabt"
path = "src/lib.rs"

[[bin]]
name = "osabt"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "tui", "gui"]
cli = ["dep:clap"]
tui = ["cli", "dep:ratatui", "dep:crossterm"]
gui = ["dep:eframe", "dep:egui", "dep:png", "dep:rfd"]
serde = ["dep:serde"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.28", optional = true }
eframe = { version = "0.29", features = ["wgpu"], optional = true }
egui = { version = "0.29", optional = true }
png = { version = "0.18", optional = true }
ratatui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
