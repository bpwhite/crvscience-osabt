name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run unit & integration tests
        run: cargo test
      - name: Check CLI-only feature matrix
        run: cargo check --no-default-features --features cli
      - name: Check GUI-only feature matrix
        run: cargo check --no-default-features --features gui
      - name: Build release binary
        run: cargo build --release
